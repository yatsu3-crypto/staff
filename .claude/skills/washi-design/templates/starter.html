<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF5E6">
<title>アプリ名｜やまもと皮膚科・漢方クリニック</title>
<!-- 唯一許可された外部リソース: Google Fonts（オフライン時はシステムフォントに自動フォールバック） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 和紙デザインシステム トークン ===== */
:root{
  --washi:#FBF5E6;   /* 画面背景（和紙） */
  --washi-d:#F2E9D2; /* 背景の濃い面・ヘッダー下端 */
  --card:#FFFCF4;    /* カード・入力欄の面 */
  --line:#D9CDB3;    /* 罫線・枠線 */
  --sumi:#332C25;    /* 本文（墨） */
  --sumi2:#5B5247;   /* 補足テキスト */
  --usu:#8C8073;     /* 薄墨: キャプション・プレースホルダ */
  --shu:#C1432E;     /* 朱: 強調・警告・選択中チップ */
  --shu-d:#9A3A2E;   /* 朱の濃色: 注意書きの太字 */
  --kin:#C08A22;     /* 金茶: アクセント・フォーカス・数値・二重罫線 */
  --kin-d:#8A6410;   /* 金茶の濃色: 小見出し文字 */
  --matsu:#2E5D4B;   /* 松葉: クリニック名・見出し前置き・肯定 */
  --ai:#22376B;      /* 藍: 主要アクション・選択中タブ・リンク */
  --akane:#8A4A5A;   /* 茜: カテゴリ色（補助） */
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(60,45,25,.35);
  --r:12px;          /* 標準角丸 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",-apple-system,sans-serif;
  color:var(--sumi);background:var(--washi);
  background-image:
    radial-gradient(circle at 18% 12%,rgba(192,138,34,.05),transparent 40%),
    radial-gradient(circle at 82% 78%,rgba(34,55,107,.05),transparent 42%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='matrix' values='0 0 0 0 0.45 0 0 0 0 0.38 0 0 0 0 0.25 0 0 0 0.025 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;letter-spacing:.02em}

/* ===== ヘッダー ===== */
header{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(251,245,230,.97),rgba(251,245,230,.9));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;
}
.brand{display:flex;align-items:center;gap:11px}
.brand h1{font-size:18px;margin:0}
.brand .sub{font-size:11px;color:var(--sumi2);letter-spacing:.04em;margin-top:1px}
.tampopo{width:34px;height:34px;flex:0 0 auto}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sumi2);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;min-height:34px}
.tab.on{background:var(--ai);color:#fff;border-color:var(--ai)}

/* ===== レイアウト ===== */
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sectitle{font-size:12px;letter-spacing:.16em;color:var(--matsu);font-weight:700;margin:20px 2px 8px}
.lead{color:var(--sumi2);font-size:14px;margin:4px 2px 14px}

/* ===== 検索・フィルタ ===== */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:var(--r);
  font-size:16px;background:var(--card);color:var(--sumi);font-family:inherit}
.search input::placeholder{color:var(--usu)}
.search input:focus{outline:none;border-color:var(--kin);box-shadow:0 0 0 3px rgba(192,138,34,.15)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sumi2);padding:6px 11px;border-radius:999px;
  font-size:12px;cursor:pointer;font-weight:600;font-family:inherit;min-height:32px}
.chip.on{background:var(--shu);color:#fff;border-color:var(--shu)}

/* ===== カード ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .12s;position:relative;overflow:hidden}
.pcard:active{transform:scale(.98)}
.pcard .emo{font-size:24px;line-height:1}
.pcard .pn{font-size:14.5px;font-weight:700;margin-top:7px}
.pcard .pc{font-size:11px;color:var(--sumi2);margin-top:3px}
.pcard .cnt{position:absolute;top:11px;right:12px;font-size:11px;color:var(--kin);font-weight:700}
.catband{position:absolute;left:0;top:0;bottom:0;width:4px}

/* ===== リスト行 ===== */
.al{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 11px;cursor:pointer;min-height:52px}
.al:active{background:var(--washi-d)}
.al .am{flex:1;min-width:0}
.al .an{font-size:14px;font-weight:700;line-height:1.3}
.al .ax{font-size:11.5px;color:var(--sumi2);margin-top:1px}
.al .conc{font-size:11px;color:var(--kin);font-weight:700;white-space:nowrap}
.allergens{display:flex;flex-direction:column;gap:7px}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.group-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:0 0 9px}

/* ===== ノート・注意 ===== */
.note{background:linear-gradient(0deg,rgba(192,138,34,.06),rgba(192,138,34,.06)),var(--card);
  border:1px solid var(--line);border-left:3px solid var(--kin);border-radius:10px;padding:10px 13px;font-size:13px;margin:10px 0 16px}
.note b{color:var(--shu-d)}
.caution{background:rgba(193,67,46,.06);border:1.5px dashed var(--shu);border-radius:10px;padding:9px 13px;font-size:13px;margin:10px 0}
.caution b{color:var(--shu)}

/* ===== ボタン ===== */
.btn{border:1px solid var(--ai);background:var(--ai);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;
  font-weight:700;cursor:pointer;font-family:inherit;min-height:44px}
.btn.ghost{background:var(--card);color:var(--ai)}
.btn.warn{border-color:var(--shu);background:var(--card);color:var(--shu)}
.btn.block{display:block;width:100%}
.btn:active{transform:scale(.98)}
.addbtn{border:1.5px solid var(--ai);color:var(--ai);background:#fff;width:32px;height:32px;border-radius:9px;
  font-size:18px;font-weight:700;cursor:pointer;flex:0 0 auto;line-height:1;font-family:inherit}
.addbtn.added{background:var(--ai);color:#fff}
.back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--ai);font-weight:700;
  font-size:14px;cursor:pointer;padding:8px 0;font-family:inherit}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card)}

/* ===== アコーディオン ===== */
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.acc summary{padding:12px 14px;font-weight:700;font-size:14.5px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .gn{margin-left:auto;font-size:11px;color:var(--sumi2);font-weight:600}
.acc .ac-body{padding:0 12px 10px}

/* ===== ボトムシート ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--washi);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto;
  box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 2px;font-size:19px}
.sheet .lbl{font-size:11px;color:var(--sumi2);font-weight:700;letter-spacing:.05em;margin:14px 0 5px}

/* ===== トースト・空状態・フッター ===== */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--sumi);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.listempty{text-align:center;color:var(--sumi2);padding:40px 20px;font-size:14px}
.listempty .big{font-size:40px;margin-bottom:8px}
.disc{font-size:11.5px;color:var(--sumi2);border-top:1px dashed var(--line);margin-top:24px;padding-top:14px;line-height:1.6}
.foot{text-align:center;font-size:11px;color:var(--sumi2);margin-top:18px}

/* ===== 印刷 ===== */
@media print{
  header,.tabs,.filters,.search,.btn,.back,.addbtn,.disc,.foot{display:none!important}
  body{background:#fff;background-image:none}
  .pcard,.al,.acc{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="tampopo" viewBox="0 0 48 48" aria-hidden="true">
      <g fill="none">
        <line x1="24" y1="46" x2="24" y2="24" stroke="#5a6e48" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M24 40c-4-1-7-4-8-7" stroke="#5a6e48" stroke-width="2" stroke-linecap="round"/>
        <circle cx="24" cy="18" r="7.5" fill="#a87d35"/>
        <g stroke="#c9a24a" stroke-width="1.5" stroke-linecap="round">
          <line x1="24" y1="18" x2="24" y2="4"/><line x1="24" y1="18" x2="34" y2="8"/>
          <line x1="24" y1="18" x2="38" y2="18"/><line x1="24" y1="18" x2="34" y2="28"/>
          <line x1="24" y1="18" x2="14" y2="8"/><line x1="24" y1="18" x2="10" y2="18"/>
          <line x1="24" y1="18" x2="14" y2="28"/><line x1="24" y1="18" x2="31" y2="3"/>
          <line x1="24" y1="18" x2="17" y2="3"/><line x1="24" y1="18" x2="39" y2="11"/>
          <line x1="24" y1="18" x2="9" y2="11"/>
        </g>
        <g fill="#fff8e8"><circle cx="24" cy="4" r="2.1"/><circle cx="34" cy="8" r="2.1"/><circle cx="38" cy="18" r="2.1"/><circle cx="34" cy="28" r="2.1"/><circle cx="14" cy="8" r="2.1"/><circle cx="10" cy="18" r="2.1"/><circle cx="14" cy="28" r="2.1"/><circle cx="31" cy="3" r="1.8"/><circle cx="17" cy="3" r="1.8"/><circle cx="39" cy="11" r="1.8"/><circle cx="9" cy="11" r="1.8"/></g>
      </g>
    </svg>
    <div>
      <h1>アプリ名</h1>
      <div class="sub">ひとことで用途を説明するサブタイトル</div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-v="a">タブA</button>
    <button class="tab" data-v="b">タブB</button>
    <button class="tab" data-v="c">タブC</button>
  </nav>
</header>

<main>
  <section class="view on" id="v-a">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#332C25" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="キーワードで探す" autocomplete="off">
    </div>
    <div class="filters">
      <button class="chip on">すべて</button><button class="chip">カテゴリ1</button><button class="chip">カテゴリ2</button>
    </div>
    <div class="note"><b>ポイント：</b>金茶の左罫線を持つノートは「覚えておいてほしいこと」に使う。</div>
    <div class="sectitle">カード一覧</div>
    <div class="grid">
      <div class="pcard"><span class="catband" style="background:var(--matsu)"></span><div class="emo">🌿</div><div class="pn">カード見出し</div><div class="pc">補足テキスト</div><div class="cnt">3件</div></div>
      <div class="pcard"><span class="catband" style="background:var(--ai)"></span><div class="emo">💊</div><div class="pn">カード見出し</div><div class="pc">補足テキスト</div><div class="cnt">5件</div></div>
    </div>
    <div class="sectitle">リスト</div>
    <div class="group-h"><span class="dot" style="background:var(--shu)"></span>グループ名 <span class="gn">2</span></div>
    <div class="allergens">
      <div class="al"><div class="am"><div class="an">項目名</div><div class="ax">補足・別名</div></div><span class="conc">1.0%</span><button class="addbtn">+</button></div>
      <div class="al"><div class="am"><div class="an">項目名</div><div class="ax">補足・別名</div></div><span class="conc">0.5%</span><button class="addbtn added">✓</button></div>
    </div>
    <div class="caution"><b>注意：</b>朱の破線枠は「やってはいけないこと・戻る条件」に使う。</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn">主要アクション</button><button class="btn ghost">副アクション</button><button class="btn warn">削除</button>
    </div>
    <div class="disc">※このアプリは院内スタッフの説明補助用です。最終判断は医師が行います。</div>
    <div class="foot mincho">やまもと皮膚科・漢方クリニック　🌼 たんぽぽちゃん</div>
  </section>
  <section class="view" id="v-b"><div class="listempty"><div class="big">🌼</div>まだ何もありません</div></section>
  <section class="view" id="v-c"><details class="acc" open><summary>アコーディオン見出し<span class="gn">3項目</span></summary><div class="ac-body">本文。</div></details></section>
</main>

<div class="sheet-bg" id="sheetBg"><div class="sheet"><div class="grab"></div><h3>シート見出し</h3><div class="lbl">ラベル</div><p>本文</p></div></div>
<div class="toast" id="toast">保存しました</div>

<script>
/* ===== 状態と保存（localStorage キーは <app>_<item>_v1 の形式） ===== */
var LS_KEY = "app_state_v1";
var store = {
  get:function(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } },
  set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
var state = store.get(LS_KEY) || { tab:"a" };
function save(){ store.set(LS_KEY, state); }

/* ===== タブ切替 ===== */
var $  = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
function showTab(v){
  state.tab = v; save();
  $$(".tab").forEach(function(b){ b.classList.toggle("on", b.dataset.v===v); });
  $$(".view").forEach(function(s){ s.classList.toggle("on", s.id==="v-"+v); });
}
$$(".tab").forEach(function(b){ b.addEventListener("click", function(){ showTab(b.dataset.v); }); });
showTab(state.tab);

/* ===== トースト・シート ===== */
var toastTimer;
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("on"); },1600); }
$("#sheetBg").addEventListener("click", function(e){ if(e.target===this) this.classList.remove("on"); });
</script>
</body>
</html>
